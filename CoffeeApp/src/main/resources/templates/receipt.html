<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            margin-bottom: 0;
        }
        table {
            width: 60%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 8px 14px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #f3f3f3;
        }
    </style>
</head>
<body>
<h2>Order Receipt</h2>

<p><strong>Order ID:</strong> <span th:text="${order.id}">[order.id]</span></p>
<p><strong>Customer:</strong> <span th:text="${order.customerName}">[order.customerName]</span></p>
<p><strong>Shop:</strong> <span th:text="${order.shopId}">[order.shopId]</span></p>
<p><strong>Time:</strong> <span th:text="${#temporals.format(order.orderTime, 'yyyy-MM-dd HH:mm')}">[order.orderTime]</span></p>
<p><strong>Status:</strong> <span th:text="${order.orderStatus}">[order.status]</span></p>

<table>
    <thead>
    <tr>
        <th>Item Name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${order.items}">
        <td th:text="${item}">Item Name</td>
    </tr>
    </tbody>
</table>

<p><strong>Total:</strong> $<span th:text="${order.total}">[order.total]</span></p>
</body>
</html>
